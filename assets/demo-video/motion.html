<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweakerr demo — Make it yours.</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0d1015; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 177.7778vh); height: auto; aspect-ratio: 16 / 9; }
    button { position: fixed; right: 24px; bottom: 24px; background: #caff79; color: #0d1015; border: 0; border-radius: 30px; padding: 13px 25px; font: 600 14px Arial, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <canvas id="film" width="1920" height="1080" aria-label="18.8-second Tweakerr file editing and element comments demo"></canvas>
  <button id="play" type="button">Play</button>
  <script src="motion.js"></script>
</body>
</html>
